name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  precommit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.15"
            otp: "26"
          - elixir: "1.19"
            otp: "28"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: mix deps.get
      - run: mix precommit
        env:
          MIX_ENV: test
